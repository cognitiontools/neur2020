<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multisensory spatial cueing</title><style>
*{box-sizing:border-box}body{margin:0;background:#101419;color:#edf1f5;font:18px/1.55 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:24px}h1,h2{line-height:1.2}p{max-width:760px}button{font:inherit;padding:12px 20px;border:1px solid #86d9ce;border-radius:8px;background:#203c3c;color:white;cursor:pointer;margin:5px}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid white}small,.muted{color:#b7c3cf}canvas{display:block;margin:12px auto;background:#000;width:min(100%,64vh);aspect-ratio:1}header,.controls{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#1b252e;padding:18px;border-radius:10px}.value{font-size:28px;font-weight:700}table{border-collapse:collapse;width:100%;font-size:15px}td,th{padding:10px;border-bottom:1px solid #43505b;text-align:right}td:first-child,th:first-child{text-align:left}.scroll{overflow:auto}.note{border-left:3px solid #86d9ce;padding:12px 18px;background:#1b252e}svg{max-width:100%;height:auto}kbd{background:#34414e;padding:2px 7px;border-radius:4px}
canvas{width:100%;aspect-ratio:2;background:#808080}label{display:block;margin:16px 0}a{color:#86d9ce}</style></head><body><main id="app"></main><script>
'use strict';
// Classroom adaptation, not a calibrated research implementation.
// Change timing and trial counts here. CTOA is measured from cue onset.
const CONFIG={cueMs:30,ctoaMs:50,targetMs:50,responseMs:1200,fixMin:400,fixMax:800,feedbackMs:300,totalMs:600000,repetitions:4,toneHz:600,noiseAmplitude:64,cueY:350,targetAlpha:0.5};
const MODS=['visual','auditory','audiovisual'];
const LABEL={visual:'Unimodal (visual)',auditory:'Crossmodal (auditory)',audiovisual:'Bimodal (audiovisual)'};
const app=document.getElementById('app');let audio=null,checked=new Set(),queue=[],rows=[],index=0,active=null,started=null,finished=false,raf=0,timer=0,deadlineTimer=0;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const median=a=>{if(!a.length)return null;const sorted=[...a].sort((a,b)=>a-b),mid=Math.floor(sorted.length/2);return sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;};
const fmt=(x,d=0)=>x===null?'—':x.toFixed(d);
function design(){const block=MODS.flatMap(modality=>[true,false].flatMap(valid=>['left','right'].flatMap(cue_side=>['vertical','horizontal'].map(orientation=>({phase:'main',modality,valid,cue_side,target_side:valid?cue_side:(cue_side==='left'?'right':'left'),orientation})))));const practice=MODS.flatMap(modality=>[true,false].flatMap(valid=>['vertical','horizontal'].map((orientation,i)=>{const cue_side=i?'right':'left';return {phase:'practice',modality,valid,cue_side,target_side:valid?cue_side:(cue_side==='left'?'right':'left'),orientation};})));return [...shuffle(practice),...Array.from({length:CONFIG.repetitions},()=>shuffle(block)).flat()];}
function tone(side){if(!audio||audio.state!=='running')return false;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain(),p=audio.createStereoPanner();o.frequency.value=CONFIG.toneHz;p.pan.value=side==='left'?-1:1;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.005);g.gain.setValueAtTime(.12,t+(CONFIG.cueMs-5)/1000);g.gain.linearRampToValueAtTime(0,t+CONFIG.cueMs/1000);o.connect(g);g.connect(p);p.connect(audio.destination);o.start(t);o.stop(t+CONFIG.cueMs/1000);o.onended=()=>{o.disconnect();g.disconnect();p.disconnect();};return true;}
async function testSound(side){try{audio??=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();if(!tone(side))throw Error();checked.add(side);document.getElementById('soundStatus').textContent='Check that each sound is heard on the labelled side. Adjust your volume if needed.';updateStart();}catch(e){document.getElementById('soundStatus').textContent='Audio could not start. Open this file in a browser with stereo audio support.';}}
function updateStart(){document.getElementById('start').disabled=!(checked.size===2&&document.getElementById('confirm').checked);}
function instructions(){app.innerHTML=`<h1>Multisensory spatial cueing</h1><p>Keep your eyes on the central cross. A brief cue will occur on the left or right: a visual flash, a sound, or both together. The visual flash appears below a possible target location. A striped target will then appear. The visual-noise background stays fixed within each trial and changes on the next trial.</p><p>Report the <b>orientation of the stripes</b>, regardless of which side the target appears on.</p><div class="cards"><div class="card"><b>↑ · Vertical</b><p>Vertical stripes: |||</p></div><div class="card"><b>↓ · Horizontal</b><p>Horizontal stripes: ≡</p></div></div><p>Respond quickly and accurately using <kbd>↑</kbd> or <kbd>↓</kbd>, or the on-screen buttons. Wait for the target before responding. The cue does not predict target location: the target appears on the same side on half the trials.</p><p><b>12 practice trials + 96 main trials.</b> Allow about 3–5 minutes. Results appear automatically, with a 10-minute maximum from starting practice.</p><h2>Stereo sound check</h2><p>Wear stereo headphones in the correct left/right orientation. Disable mono audio. These headphone cues indicate a side; they do not reproduce a loudspeaker at the visual cue location.</p><button id="left">Test left sound</button><button id="right">Test right sound</button><p id="soundStatus" aria-live="polite">Test both sides before starting.</p><label><input type="checkbox" id="confirm"> I hear each sound on the correct side.</label><button id="start" disabled>Start practice</button><details><summary>Demonstration settings</summary><p>Cue: 30 ms. Cue-to-target onset asynchrony: 50 ms (nominal 20-ms gap). Target: 50 ms. Response window: 1,200 ms from target onset. All three modalities are equally frequent; validity is 50% within each modality.</p><p>Browser refresh rates round visual timing to frames; 30 ms cannot be represented exactly on every display. Audio and display latencies are not calibrated. This is a classroom adaptation, with screen-relative stimulus sizes.</p></details>`;document.getElementById('left').onclick=()=>testSound('left');document.getElementById('right').onclick=()=>testSound('right');document.getElementById('confirm').onchange=updateStart;document.getElementById('start').onclick=start;}
// One noise image per trial. Both target orientations add a Gaussian-windowed
// sinusoid to those same noise pixels, so no rectangular patch replaces the noise.
function makeNoise(){const canvas=document.createElement('canvas');canvas.width=1000;canvas.height=500;const c=canvas.getContext('2d'),im=c.createImageData(1000,500);for(let y=0;y<500;y+=2)for(let x=0;x<1000;x+=2){const v=Math.round(128+(Math.random()*2-1)*CONFIG.noiseAmplitude);for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){const i=((y+dy)*1000+x+dx)*4;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}}c.putImageData(im,0,0);return {canvas,pixels:im.data};}
function gabor(orientation,noise,side){const size=160,canvas=document.createElement('canvas');canvas.width=canvas.height=size;const c=canvas.getContext('2d'),im=c.createImageData(size,size),left=(side==='left'?220:780)-80;for(let y=0;y<size;y++)for(let x=0;x<size;x++){const dx=x-size/2,dy=y-size/2,u=orientation==='vertical'?dx:dy,env=Math.exp(-(dx*dx+dy*dy)/(2*26*26)),base=noise.pixels[((170+y)*1000+left+x)*4],value=Math.round(Math.max(0,Math.min(255,base+90*env*Math.cos(2*Math.PI*u/20)))),i=(y*size+x)*4;im.data[i]=im.data[i+1]=im.data[i+2]=value;im.data[i+3]=255;}c.putImageData(im,0,0);return canvas;}
function draw(cue=false,target=false){const canvas=document.getElementById('field');if(!canvas||!active)return;const c=canvas.getContext('2d');c.drawImage(active.noise.canvas,0,0);if(cue&&active.modality!=='auditory'){c.fillStyle='#fff';c.beginPath();c.arc(active.cue_side==='left'?220:780,CONFIG.cueY,10,0,Math.PI*2);c.fill();}if(target){c.save();c.globalAlpha=CONFIG.targetAlpha;c.drawImage(active.patch,(active.target_side==='left'?220:780)-80,170);c.restore();}for(const [colour,width] of [['#000',5],['#fff',2]]){c.strokeStyle=colour;c.lineWidth=width;c.beginPath();c.moveTo(492,250);c.lineTo(508,250);c.moveTo(500,242);c.lineTo(500,258);c.stroke();}}
function start(){queue=design();rows=[];index=0;finished=false;started=performance.now();deadlineTimer=setTimeout(()=>summary('The 10-minute limit was reached.'),CONFIG.totalMs);next();}
function next(){if(finished)return;if(performance.now()-started>=CONFIG.totalMs)return summary('The 10-minute limit was reached.');if(index>=queue.length)return summary('Demonstration complete.');const t=queue[index],practice=t.phase==='practice';app.innerHTML=`<header><b>${practice?'Practice':'Main trial'} ${practice?index+1:index-11} / ${practice?12:96}</b><small id="time"></small><button id="finish">Finish and view results</button></header><canvas id="field" width="1000" height="500" aria-label="Keep your eyes on the central cross and report the target stripe orientation"></canvas><div class="controls"><button id="vertical">↑ · Vertical</button><button id="horizontal">↓ · Horizontal</button></div><p id="feedback" aria-live="polite">${index===12?'Practice complete. Main trials begin now.':'Keep looking at the central cross.'}</p>`;document.getElementById('finish').onclick=()=>summary('Finished early.');document.getElementById('vertical').onclick=()=>respond('vertical','button');document.getElementById('horizontal').onclick=()=>respond('horizontal','button');active={...t,fixStart:null,fixDuration:CONFIG.fixMin+Math.random()*(CONFIG.fixMax-CONFIG.fixMin),cueOn:null,cueOff:null,targetOn:null,targetOff:null,audioOK:null,lastFrame:null,maxFrameGap:0};active.noise=makeNoise();active.patch=gabor(active.orientation,active.noise,active.target_side);draw();raf=requestAnimationFrame(frame);}
function frame(t){if(finished||!active)return;if(t-started>=CONFIG.totalMs)return summary('The 10-minute limit was reached.');const a=active;if(a.fixStart===null)a.fixStart=t;if(a.lastFrame!==null)a.maxFrameGap=Math.max(a.maxFrameGap,t-a.lastFrame);a.lastFrame=t;let changed=false;
if(a.cueOn===null&&t-a.fixStart>=a.fixDuration){a.cueOn=t;changed=true;if(a.modality!=='visual')a.audioOK=tone(a.cue_side);}
if(a.cueOn!==null&&a.cueOff===null&&t-a.cueOn>=CONFIG.cueMs){a.cueOff=t;changed=true;}
if(a.cueOn!==null&&a.targetOn===null&&t-a.cueOn>=CONFIG.ctoaMs){a.targetOn=t;changed=true;}
if(a.targetOn!==null&&a.targetOff===null&&t-a.targetOn>=CONFIG.targetMs){a.targetOff=t;changed=true;}
if(changed)draw(a.cueOn!==null&&a.cueOff===null,a.targetOn!==null&&a.targetOff===null);
if(a.targetOn!==null&&t-a.targetOn>=CONFIG.responseMs)return end(null,null,'timeout');const left=Math.max(0,Math.ceil((CONFIG.totalMs-(t-started))/1000));document.getElementById('time').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')} remaining`;raf=requestAnimationFrame(frame);}
function respond(response,input){if(!active||finished)return;if(performance.now()-started>=CONFIG.totalMs)return summary('The 10-minute limit was reached.');if(active.targetOn===null)return end(response,input,'early');if(performance.now()-active.targetOn>=CONFIG.responseMs)return end(null,null,'timeout');end(response,input,'response');}
function record(response,input,status){const a=active,rt=status==='response'?performance.now()-a.targetOn:null;rows.push({phase:a.phase,modality:a.modality,valid:a.valid,cue_side:a.cue_side,target_side:a.target_side,orientation:a.orientation,response,input,status,correct:status==='response'&&response===a.orientation,rt_ms:rt,rt_eligible:status==='response'&&response===a.orientation&&rt>=100,target_alpha:CONFIG.targetAlpha,cue_requested_ms:CONFIG.cueMs,ctoa_requested_ms:CONFIG.ctoaMs,cue_frame_duration_ms:a.cueOff!==null?a.cueOff-a.cueOn:null,target_frame_ctoa_ms:a.targetOn!==null?a.targetOn-a.cueOn:null,target_frame_duration_ms:a.targetOff!==null?a.targetOff-a.targetOn:null,audio_started:a.audioOK,max_frame_gap_ms:a.maxFrameGap});}
function end(response,input,status){cancelAnimationFrame(raf);const a=active;record(response,input,status);draw();active=null;index++;document.getElementById('feedback').textContent=status==='early'?'Too soon. Wait for the striped target.':status==='timeout'?'Time ran out.':a.phase==='practice'?(response===a.orientation?'Correct.':`The stripes were ${a.orientation}.`):'Response recorded.';timer=setTimeout(next,CONFIG.feedbackMs);}
function stats(modality,valid){const all=rows.filter(r=>r.phase==='main'&&r.status!=='interrupted'&&r.modality===modality&&r.valid===valid),correct=all.filter(r=>r.correct),rt=all.filter(r=>r.rt_eligible).map(r=>r.rt_ms);return {n:all.length,correct:correct.length,rtN:rt.length,rt:median(rt),accuracy:all.length?100*correct.length/all.length:null};}
function effect(modality){const v=stats(modality,true),i=stats(modality,false);return v.rt===null||i.rt===null?null:i.rt-v.rt;}
function plot(){const values=MODS.map(effect),bound=Math.max(50,...values.filter(x=>x!==null).map(Math.abs))*1.15;return `<svg viewBox="0 0 700 280" role="img" aria-label="Invalid minus valid median response time for each cue modality"><text x="10" y="25" fill="white">Cueing effect (ms): invalid − valid median RT</text><path d="M350 45V225" stroke="#b7c3cf"/>${values.map((v,i)=>{const y=65+i*65,w=v===null?0:Math.abs(v)/bound*240;return `<text x="8" y="${y+20}" fill="white">${MODS[i]}</text><rect x="${v!==null&&v<0?350-w:350}" y="${y}" width="${w}" height="28" fill="${['#f5a34a','#ef83b5','#65a8f3'][i]}"/><text x="620" y="${y+20}" fill="white">${fmt(v)}</text>`;}).join('')}<text x="350" y="250" text-anchor="middle" fill="#b7c3cf">0</text></svg>`;}
function summary(reason){if(finished)return;finished=true;cancelAnimationFrame(raf);clearTimeout(timer);clearTimeout(deadlineTimer);if(active)record(null,null,'interrupted');active=null;const main=rows.filter(r=>r.phase==='main'&&r.status!=='interrupted'),b=effect('audiovisual'),u=effect('visual'),c=effect('auditory'),contrast=x=>b===null||x===null?null:b-x;app.innerHTML=`<h1>Your cueing results</h1><p>${reason} ${main.length} of 96 main trials completed. Practice trials are excluded.</p><div class="cards">${MODS.map(m=>`<div class="card">${LABEL[m]}<div class="value">${fmt(effect(m))} ms</div><small>Invalid − valid median RT</small></div>`).join('')}</div>${plot()}<div class="scroll"><table><thead><tr><th>Cue</th><th>Validity</th><th>Median RT (ms)</th><th>Accuracy</th><th>RT trials</th></tr></thead><tbody>${MODS.flatMap(m=>[true,false].map(valid=>{const s=stats(m,valid);return `<tr><td>${LABEL[m]}</td><td>${valid?'Valid':'Invalid'}</td><td>${fmt(s.rt)}</td><td>${fmt(s.accuracy)}% (${s.correct}/${s.n})</td><td>${s.rtN}</td></tr>`;})).join('')}</tbody></table></div><p><b>Bimodal − unimodal cueing effect:</b> ${fmt(contrast(u))} ms<br><b>Bimodal − crossmodal cueing effect:</b> ${fmt(contrast(c))} ms</p><div class="note"><p>Cueing effects are calculated as invalid median RT minus valid median RT within each modality. A positive cueing effect means responses were faster when the cue and target appeared on the same side. A positive bimodal contrast means the audiovisual cue produced a larger valid–invalid difference than the comparison cue.</p><p>Compare the validity differences, not just overall speed. Faster responses across both valid and invalid trials do not necessarily indicate stronger spatial orienting. Also compare accuracy: speed and accuracy can trade off.</p><p>This short demonstration may or may not show a larger bimodal cueing effect for an individual student. These are descriptive results, not a statistical test of multisensory integration.</p></div><p class="muted">RT starts at target onset. Medians include correct responses of at least 100 ms; accuracy includes all completed trials. Early responses and timeouts count as incorrect. Interrupted trials are excluded. Dashes indicate insufficient data.</p><p class="muted">Early responses: ${main.filter(r=>r.status==='early').length}. Timeouts: ${main.filter(r=>r.status==='timeout').length}. Correct RTs below 100 ms: ${main.filter(r=>r.correct&&!r.rt_eligible).length}.</p><details><summary>Timing and adaptation notes</summary><p>Classroom adaptation of Scott, L., Kritikos, A., &amp; Zeljko, M. (2026). Two senses are better than one: Enhanced orienting to bimodal cues at short cue-target onset asynchronies. <i>Acta Psychologica, 264</i>, Article 106378. <a href="https://doi.org/10.1016/j.actpsy.2026.106378" target="_blank" rel="noopener">https://doi.org/10.1016/j.actpsy.2026.106378</a></p><p>The published speeded task used 100-ms cues and 50-ms targets at full opacity. This classroom version uses the requested 30-ms cues, 50-ms targets, 50% target opacity, up/down responses and median RT summaries.</p><p>Requested cue duration: ${CONFIG.cueMs} ms; CTOA: ${CONFIG.ctoaMs} ms; target duration: ${CONFIG.targetMs} ms. Mean frame-based CTOA: ${fmt(mean(main.map(r=>r.target_frame_ctoa_ms).filter(x=>x!==null)),1)} ms. These timestamps describe browser drawing callbacks, not measured light or sound onset.</p><p>Trial timing is rounded to display frames. Stereo headphone cues, stimulus size, target contrast (50% target opacity) and background noise are classroom adaptations. They do not reproduce calibrated visual angles or external loudspeaker locations.</p><p>Trials with display gaps over 50 ms: ${main.filter(r=>r.max_frame_gap_ms>50).length}. Trials with audio start failure: ${main.filter(r=>r.audio_started===false).length}.</p></details><button id="download">Download results (CSV)</button><button id="restart">Restart</button>`;document.getElementById('download').onclick=download;document.getElementById('restart').onclick=()=>location.reload();}
function download(){if(!rows.length)return;const keys=Object.keys(rows[0]),csv=[keys.join(','),...rows.map(r=>keys.map(k=>r[k]??'').join(','))].join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download='multisensory-cueing-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key;if(k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();respond(k==='ArrowUp'?'vertical':'horizontal','keyboard');}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&started!==null&&!finished)summary('Stopped because this tab was hidden. Keep the tab visible during a run.');});
instructions();
</script></body></html>
