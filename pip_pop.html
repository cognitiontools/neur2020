<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pip-and-pop • Student demonstration</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101419;color:#edf1f5;font:18px/1.55 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:24px}h1,h2{line-height:1.2}p{max-width:760px}button{font:inherit;padding:12px 20px;border:1px solid #86d9ce;border-radius:8px;background:#203c3c;color:white;cursor:pointer;margin:5px}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid white}small,.muted{color:#b7c3cf}canvas{display:block;margin:12px auto;background:#000;width:min(100%,64vh);aspect-ratio:1}header,.controls{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#1b252e;padding:18px;border-radius:10px}.value{font-size:28px;font-weight:700}table{border-collapse:collapse;width:100%;font-size:15px}td,th{padding:10px;border-bottom:1px solid #43505b;text-align:right}td:first-child,th:first-child{text-align:left}.scroll{overflow:auto}.note{border-left:3px solid #86d9ce;padding:12px 18px;background:#1b252e}svg{max-width:100%;height:auto}kbd{background:#34414e;padding:2px 7px;border-radius:4px}
</style></head><body><main id="app"></main>
<script>
'use strict';
// Classroom adaptation of Van der Burg et al. (2008), Experiment 1.
// Reduced trial count and a 12-s search deadline; browser timing is not calibrated.
// No dependencies, network requests, participant identifiers, or automatic uploads.
const CONFIG={sizes:[24,36,48],practice:6,repetitions:3,trialMs:12000,totalMs:600000,fixationMs:400,feedbackMs:500};
const app=document.getElementById('app');
let audio=null,enabled=false,rows=[],queue=[],index=0,active=null,raf=0,transition=0,deadlineTimer=0,startTime=null,finished=false;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const fmt=(x,d=0)=>x===null?'—':x.toFixed(d);
async function enableAudio(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();if(audio.state!=='running')throw Error();pip();enabled=true;document.getElementById('start').disabled=false;document.getElementById('audioStatus').textContent='If you heard the pip, you are ready. Adjust your volume to a comfortable level.';}catch(e){document.getElementById('audioStatus').textContent='Audio could not start. Try opening this file in Chrome, Edge, or Firefox.';}}
function pip(){if(!audio||audio.state!=='running')return false;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.frequency.value=500;o.type='sine';g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.005);g.gain.setValueAtTime(.12,t+.055);g.gain.linearRampToValueAtTime(0,t+.060);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.060);o.onended=()=>{o.disconnect();g.disconnect();};return true;}
function instructions(){app.innerHTML=`<h1>Pip-and-pop visual search</h1><p>Find the one <b>horizontal or vertical line</b> among tilted lines. All lines stay in place while groups of them change between red and green.</p><p>Respond as soon as you find the target: <kbd>F</kbd> = horizontal (—), <kbd>J</kbd> = vertical (|). You can also use the on-screen buttons.</p><p>Some trials include a brief sound at each target colour change. The sound does not tell you where the target is. Other trials are silent. You can respond at any point during the search.</p><p>There are <b>6 practice trials and 36 demonstration trials</b>. Each search lasts up to 12 seconds. The activity ends automatically within <b>10 minutes of pressing Start</b>, and your results appear on screen.</p><p class="muted">Use headphones or speakers. Keep this tab visible. The display contains repeated colour changes.</p><button id="test">Test sound</button><button id="start" disabled>Start practice</button><p id="audioStatus" aria-live="polite">Test the sound before starting.</p>`;document.getElementById('test').onclick=enableAudio;document.getElementById('start').onclick=start;}
function buildTrials(){const make=phase=>CONFIG.sizes.flatMap(size=>[false,true].flatMap(sound=>['horizontal','vertical'].map(orientation=>({phase,size,sound,orientation}))));const practice=CONFIG.sizes.flatMap(size=>[false,true].map((sound,i)=>({phase:'practice',size,sound,orientation:i?'vertical':'horizontal'})));return [...shuffle(practice),...Array.from({length:CONFIG.repetitions},()=>shuffle(make('main'))).flat()];}
// Each 900-ms cycle has nine intervals: 3 x 50, 3 x 100, 3 x 150 ms.
// Event j follows intervals[j-1] and precedes intervals[j]. Target changes alone.
function cycle(first=false){let intervals,target,events;do{intervals=shuffle([50,50,50,100,100,100,150,150,150]);let candidates=[];let time=0;for(let j=0;j<9;j++){if(j>0&&intervals[j-1]===150&&intervals[j]===100&&(!first||time>=500))candidates.push(j);time+=intervals[j];}target=pick(candidates);if(target!==undefined){let t=0;events=intervals.map((duration,j)=>{const event={at:t,target:j===target};t+=duration;return event;});}}while(!events);return events;}
function itemsFor(trial){const grid=shuffle(Array.from({length:100},(_,i)=>({row:Math.floor(i/10),col:i%10})));const targetAt=grid.findIndex(p=>![44,45,54,55].includes(p.row*10+p.col));const target=grid.splice(targetAt,1)[0];return [target,...grid.slice(0,trial.size-1)].map((p,i)=>({x:(p.col+.5+(Math.random()-.5)*.34)/10,y:(p.row+.5+(Math.random()-.5)*.34)/10,angle:i===0?(trial.orientation==='horizontal'?0:90):pick([22.5,-22.5,67.5,112.5]),colour:Math.random()<.5?0:1}));}
function start(){if(!enabled)return;rows=[];queue=buildTrials();index=0;finished=false;startTime=performance.now();deadlineTimer=setTimeout(()=>summary('The 10-minute limit was reached.'),CONFIG.totalMs);nextTrial();}
function draw(items,fixationOnly=false){const canvas=document.getElementById('search');if(!canvas)return;const c=canvas.getContext('2d'),w=canvas.width;c.fillStyle='#000';c.fillRect(0,0,w,w);if(!fixationOnly)for(const item of items){const a=item.angle*Math.PI/180,L=w*.057/2,x=item.x*w,y=item.y*w;c.strokeStyle=item.colour?'#00c000':'#d00000';c.lineWidth=Math.max(2,w*.004);c.beginPath();c.moveTo(x-Math.cos(a)*L,y-Math.sin(a)*L);c.lineTo(x+Math.cos(a)*L,y+Math.sin(a)*L);c.stroke();}c.fillStyle='white';c.beginPath();c.arc(w/2,w/2,2,0,Math.PI*2);c.fill();}
function nextTrial(){if(finished)return;if(performance.now()-startTime>=CONFIG.totalMs)return summary('The 10-minute limit was reached.');if(index>=queue.length)return summary('Demonstration complete.');const trial=queue[index];const n=trial.phase==='practice'?index+1:index-CONFIG.practice+1;app.innerHTML=`<header><b>${trial.phase==='practice'?'Practice':'Demonstration'} ${n} / ${trial.phase==='practice'?6:36}</b><small id="remaining"></small><button id="end">Finish and view results</button></header><canvas id="search" width="800" height="800" aria-label="Find a horizontal or vertical line among tilted lines"></canvas><div class="controls"><button id="horizontal">F · Horizontal —</button><button id="vertical">J · Vertical |</button></div><p id="feedback" aria-live="polite">${index===6?'Practice complete. These trials count towards your results.':'Find the horizontal or vertical line.'}</p>`;document.getElementById('end').onclick=()=>summary('Finished early.');document.getElementById('horizontal').onclick=()=>respond('horizontal','touch/button');document.getElementById('vertical').onclick=()=>respond('vertical','touch/button');active={...trial,items:itemsFor(trial),onset:null,events:cycle(true),eventIndex:0,cycleStart:0,firstChange:null,pips:0,audioFailures:0,maxFrameGap:0,lastFrame:null};draw([],true);transition=setTimeout(()=>{if(!active||finished)return;raf=requestAnimationFrame(beginSearch);},CONFIG.fixationMs);}
function beginSearch(t){if(!active||finished)return;active.onset=t;active.lastFrame=t;draw(active.items);raf=requestAnimationFrame(frame);}
function frame(t){if(!active||finished)return;if(t-startTime>=CONFIG.totalMs)return summary('The 10-minute limit was reached.');const a=active,elapsed=t-a.onset;a.maxFrameGap=Math.max(a.maxFrameGap,t-a.lastFrame);a.lastFrame=t;if(elapsed>=CONFIG.trialMs)return endTrial(null,null,'timeout');let event=a.events[a.eventIndex];if(elapsed>=a.cycleStart+event.at){if(event.target){a.items[0].colour^=1;if(a.firstChange===null)a.firstChange=elapsed;draw(a.items);if(a.sound){if(pip())a.pips++;else a.audioFailures++;}}else{const count=pick(a.size===24?[1,2,3]:a.size===36?[1,3,5]:[1,4,7]);for(const i of shuffle(Array.from({length:a.size-1},(_,i)=>i+1)).slice(0,count))a.items[i].colour^=1;draw(a.items);} // Anchor the next interval to this rendered change; never collapse missed events into one frame.
const nextAt=a.eventIndex<8?a.events[a.eventIndex+1].at:900;const gap=nextAt-event.at;a.eventIndex++;if(a.eventIndex===9){a.events=cycle();a.eventIndex=0;a.cycleStart=elapsed+gap;}else a.cycleStart=elapsed-event.at;}
const left=Math.max(0,Math.ceil((CONFIG.totalMs-(t-startTime))/1000));document.getElementById('remaining').textContent=`Time remaining ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;raf=requestAnimationFrame(frame);}
function respond(orientation,input){if(!active||active.onset===null||finished)return;if(performance.now()-startTime>=CONFIG.totalMs)return summary('The 10-minute limit was reached.');if(performance.now()-active.onset>=CONFIG.trialMs)return endTrial(null,null,'timeout');endTrial(orientation,input,'response');}
function endTrial(response,input,status){cancelAnimationFrame(raf);const a=active;if(!a)return;const rt=response?performance.now()-a.onset:null;rows.push({phase:a.phase,set_size:a.size,pip_present:a.sound,target_orientation:a.orientation,response,input,status,correct:response===a.orientation,rt_ms:rt,first_target_change_ms:a.firstChange,pips_played:a.pips,audio_failures:a.audioFailures,max_frame_gap_ms:a.maxFrameGap});active=null;index++;draw([],true);document.getElementById('feedback').textContent=a.phase==='practice'?(status==='timeout'?'Time ran out.':response===a.orientation?'Correct.':`The target was ${a.orientation}.`):(status==='timeout'?'Time ran out. Next trial…':'Response recorded.');transition=setTimeout(nextTrial,CONFIG.feedbackMs);}
document.addEventListener('keydown',e=>{if(e.repeat)return;if(['f','j'].includes(e.key.toLowerCase())){e.preventDefault();respond(e.key.toLowerCase()==='f'?'horizontal':'vertical','keyboard');}});
// Hidden tabs stop immediately: background throttling would spoil AV timing.
document.addEventListener('visibilitychange',()=>{if(document.hidden&&startTime!==null&&!finished)summary('Stopped because the tab was hidden. Restart when you can keep this tab visible.');});
function cell(size,sound){const trials=rows.filter(r=>r.phase==='main'&&r.status!=='interrupted'&&r.set_size===size&&r.pip_present===sound),correct=trials.filter(r=>r.correct);return {n:trials.length,correct:correct.length,rt:mean(correct.map(r=>r.rt_ms)),accuracy:trials.length?100*correct.length/trials.length:null,timeouts:trials.filter(r=>r.status==='timeout').length};}
function slope(cells){if(cells.some(c=>c.rt===null))return null;return (cells[2].rt-cells[0].rt)/24;}
function plot(p,n){const values=[...p,...n].map(c=>c.rt).filter(x=>x!==null);if(!values.length)return '';const max=Math.max(...values)*1.15||1,x=i=>90+i*210,y=v=>240-v/max*190;const series=(cells,col)=>{const points=cells.map((c,i)=>c.rt===null?null:[x(i),y(c.rt)]);return (points.every(Boolean)?`<polyline points="${points.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="3"/>`:'')+points.map((p,i)=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${col}"/><text x="${p[0]}" y="${p[1]-12}" text-anchor="middle" fill="${col}">${fmt(cells[i].rt)}</text>`:'').join('');};return `<svg viewBox="0 0 620 310" role="img" aria-label="Mean correct response time by set size; pip in teal, no pip in orange"><path d="M70 40V240H540" fill="none" stroke="#b7c3cf"/><text x="70" y="24" fill="white">Mean correct RT (ms)</text>${[0,.5,1].map(f=>`<text x="60" y="${y(max*f)+5}" text-anchor="end" fill="#b7c3cf">${fmt(max*f)}</text>`).join('')}${series(p,'#86d9ce')}${series(n,'#ffbb80')}${CONFIG.sizes.map((s,i)=>`<text x="${x(i)}" y="266" fill="white" text-anchor="middle">${s}</text>`).join('')}<text x="290" y="295" fill="white" text-anchor="middle">Set size (lines)</text></svg>`;}
function summary(reason){if(finished)return;finished=true;cancelAnimationFrame(raf);clearTimeout(transition);clearTimeout(deadlineTimer);if(active&&active.onset!==null)rows.push({phase:active.phase,set_size:active.size,pip_present:active.sound,target_orientation:active.orientation,response:null,input:null,status:'interrupted',correct:false,rt_ms:null,first_target_change_ms:active.firstChange,pips_played:active.pips,audio_failures:active.audioFailures,max_frame_gap_ms:active.maxFrameGap});active=null;const p=CONFIG.sizes.map(s=>cell(s,true)),n=CONFIG.sizes.map(s=>cell(s,false)),complete=[...p,...n].every(c=>c.rt!==null),pm=complete?mean(p.map(c=>c.rt)):null,nm=complete?mean(n.map(c=>c.rt)):null,benefit=complete?nm-pm:null,ps=slope(p),ns=slope(n);const done=rows.filter(r=>r.phase==='main'&&r.status!=='interrupted').length;app.innerHTML=`<h1>Your search results</h1><p>${reason} ${done} of 36 demonstration trials completed. Practice trials are excluded.</p><div class="cards"><div class="card">Pip RT<div class="value">${fmt(pm)} ms</div></div><div class="card">No-pip RT<div class="value">${fmt(nm)} ms</div></div><div class="card">No-pip − pip<div class="value">${fmt(benefit)} ms</div></div></div><p><span style="color:#86d9ce">● Pip</span> &nbsp; <span style="color:#ffbb80">● No pip</span></p>${plot(p,n)}<div class="scroll"><table><thead><tr><th>Set size</th><th>Pip RT (ms)</th><th>Pip accuracy</th><th>No-pip RT (ms)</th><th>No-pip accuracy</th></tr></thead><tbody>${CONFIG.sizes.map((s,i)=>`<tr><td>${s}</td><td>${fmt(p[i].rt)}</td><td>${fmt(p[i].accuracy)}% (${p[i].correct}/${p[i].n})</td><td>${fmt(n[i].rt)}</td><td>${fmt(n[i].accuracy)}% (${n[i].correct}/${n[i].n})</td></tr>`).join('')}</tbody></table></div><p>Search slope: <b>pip ${fmt(ps,1)} ms/item</b>; <b>no pip ${fmt(ns,1)} ms/item</b>.</p><div class="note"><p>${benefit===null?'There are not enough correct responses across all conditions to calculate the overall comparison.':benefit>0?'Your correct responses were faster with the pip, averaged equally across the three set sizes.':benefit<0?'Your correct responses were faster without the pip, averaged equally across the three set sizes.':'Your average correct response times were the same with and without the pip.'}</p><p>A positive no-pip − pip difference indicates faster search with sound. A shallower slope indicates less additional search time as more lines are added. These are descriptive classroom results; a short individual run may not show the published effect. Compare accuracy as well as speed.</p></div><p class="muted">RT is measured from search-display onset using correct responses only. Overall RT weights the three set sizes equally. Timeouts count as incorrect; interrupted trials are excluded. Timeouts: ${[...p,...n].reduce((s,c)=>s+c.timeouts,0)}. A dash means insufficient data. Slopes require a correct response at every set size.</p>${rows.some(r=>r.audio_failures||r.max_frame_gap_ms>100)?'<p class="note">Audio or display timing interruptions were detected. Interpret this run cautiously.</p>':''}<details><summary>About this demonstration</summary><p>Adapted from Experiment 1: fewer trials, randomised pip/no-pip trials, brief practice, 12-second trial deadlines and a 10-minute overall limit. Red/green colours and visual angles are not calibrated; screen refresh and audio latency can affect synchrony. This is a teaching demonstration, not a validated research implementation.</p><p>Van der Burg, E., Olivers, C. N. L., Bronkhorst, A. W., &amp; Theeuwes, J. (2008). Pip and pop: Nonspatial auditory signals improve spatial visual search. <i>Journal of Experimental Psychology: Human Perception and Performance, 34</i>(5), 1053–1065. <a style="color:#86d9ce" href="https://doi.org/10.1037/0096-1523.34.5.1053">https://doi.org/10.1037/0096-1523.34.5.1053</a></p></details><button id="download">Download trial results (CSV)</button><button id="restart">Restart</button>`;document.getElementById('restart').onclick=()=>location.reload();document.getElementById('download').onclick=download;}
function download(){if(!rows.length)return;const keys=Object.keys(rows[0]),csv=[keys.join(','),...rows.map(r=>keys.map(k=>r[k]??'').join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='pip-and-pop-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
instructions();
</script></body></html>
